<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Settle Up</title>
<meta name="description" content="Split shared expenses with friends and see who owes whom.">
<meta name="theme-color" content="#0f6e56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13493d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Settle Up">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="modulepreload" href="i18n.js">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <!-- Start / join screens -->
  <div class="bar" id="barStart">
    <span class="logo">Settle<span>Up</span></span>
    <select id="langSel" class="lang" aria-label="Language">
      <option value="en">EN</option>
      <option value="zh-Hant">中文</option>
    </select>
    <button class="chip-btn" id="acctBtn" type="button"></button>
  </div>
</header>

<div class="banner-wrap"><div class="banner" id="statusBanner" hidden><span id="statusText"></span></div></div>

<div class="ptr" id="ptr" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>

<main class="main">

  <section id="loadingView" class="view loading" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint" data-i18n="loading">Loading…</p>
  </section>

  <!-- Start screen -->
  <section id="startView" class="view" hidden>
    <div class="card" id="groupsCard" hidden>
      <label class="field"><span data-i18n="yourGroups">Your groups</span>
        <select id="groupSel"></select>
      </label>
      <button class="btn primary" id="openGroupBtn" type="button" data-i18n="openGroup">Open group</button>
    </div>

    <button class="btn ghost wide" id="newGroupBtn" type="button"><span aria-hidden="true">＋</span> <span data-i18n="newGroup">New group</span></button>

    <form class="card" id="createForm" hidden novalidate>
      <h2 data-i18n="startGroup">Start a group</h2>
      <label class="field"><span data-i18n="groupName">Group name</span><input id="groupName" data-i18n-ph="groupNamePh" placeholder="Bali trip, Flat 4B, Friday dinners…" maxlength="60" autocomplete="off"></label>
      <label class="field"><span data-i18n="yourName">Your name</span><input id="founderName" data-i18n-ph="yourNamePh" placeholder="e.g. Alex" maxlength="24" autocomplete="off"></label>
      <label class="field"><span data-i18n="homeCurrency">Home currency</span><select id="newCurrency" class="currency-select"></select></label>
      <p class="hint" data-i18n="homeCurrencyHint">Balances are settled in this currency. You can still log expenses in any currency on a trip.</p>
      <p class="err" id="createErr"></p>
      <button class="btn primary" type="submit" data-i18n="createGroup">Create group</button>
    </form>

    <p class="hint acct-note" id="acctNote"></p>
  </section>

  <!-- Join screen: first visit to a group on this device -->
  <section id="joinView" class="view" hidden>
    <div class="card">
      <span class="eyebrow" data-i18n="joinGroup">Join group</span>
      <h2 id="joinGroupName"></h2>
      <p class="hint" data-i18n="whichOne">Which one are you? You only do this once on each device.</p>
      <div class="join-list" id="joinList"></div>
      <div class="join-new">
        <label class="field"><span data-i18n="notOnList">Not on the list? Add yourself</span>
          <span class="inline">
            <input id="joinName" data-i18n-ph="yourNameShort" placeholder="Your name" maxlength="24" autocomplete="off">
            <button class="btn primary" id="joinNewBtn" type="button" data-i18n="join">Join</button>
          </span>
        </label>
      </div>
      <p class="err" id="joinErr"></p>
      <button class="link" id="joinBack" type="button" hidden data-i18n="cancel">Cancel</button>
    </div>
  </section>

  <!-- Group: Home -->
  <section id="homeView" class="view group-view" hidden>
    <div class="hero">
      <div class="hero-bar">
        <button class="group-switch" id="switchBtn" type="button"><span id="gName"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="icon-btn" id="inviteBtn" type="button" aria-label="Copy invite link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M19 8v6M16 11h6"/></svg></button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Group settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      </div>
      <div class="hero-num num" id="heroNum"></div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-pays" id="heroPays"></div>
    </div>

    <div class="people-strip" id="peopleStrip"></div>

    <div class="pad">
      <div class="sec-head" id="othersHead"><h2 data-i18n="othersSettle">Other payments</h2></div>
      <div class="list-card" id="othersList"></div>

      <div class="sec-head"><h2 data-i18n="recent">Recent</h2><button class="link" id="seeAllBtn" type="button" data-i18n="seeAll">See all</button></div>
      <div class="feed" id="recentList"></div>

      <button class="chip-action" id="shareSumBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg> <span data-i18n="shareSummary">Share summary</span></button>
    </div>
  </section>

  <!-- Group: Activity -->
  <section id="activityView" class="view group-view" hidden>
    <div class="page-head"><h1 data-i18n="activity">Activity</h1></div>
    <div class="filters" id="filters">
      <button type="button" data-f="all" class="on" data-i18n="filterAll">All</button>
      <button type="button" data-f="mine" data-i18n="filterMine">Paid by me</button>
      <button type="button" data-f="repay" data-i18n="filterRepay">Repayments</button>
    </div>
    <div class="pad" id="activityList"></div>
  </section>
</main>

<!-- Floating dock -->
<nav class="dock" id="dock" hidden>
  <button type="button" data-tab="home" id="tabBtnHome"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="home">Home</span></button>
  <button type="button" class="plus" id="plusBtn" aria-label="Add expense"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" data-tab="activity" id="tabBtnAct"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span data-i18n="activity">Activity</span></button>
</nav>

<!-- Add expense form (shown full screen from the + button) -->
<div id="addHolder" hidden>
  <form id="expForm" class="add-form" novalidate>
    <div class="add-head">
      <button class="icon-btn" type="button" id="addClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 data-i18n="addExpenseTitle">Add expense</h2>
      <span style="width:40px"></span>
    </div>
    <div class="amount-hero">
      <input id="amount" class="amount-input num" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount">
      <label class="cur-chip"><span id="curChipText">USD</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><select id="expCurrency" class="currency-select" aria-label="Currency"></select></label>
      <p class="conv" id="convLine"></p>
      <div class="fx" id="fxBox" hidden>
        <span class="inline fx-inline">
          <span class="num" id="fxFrom">1 JPY =</span>
          <input id="fxRate" inputmode="decimal" autocomplete="off" aria-label="Exchange rate">
          <span class="num" id="fxTo">USD</span>
        </span>
        <p class="hint" id="fxNote"></p>
      </div>
    </div>
    <label class="field-row"><span class="cat-icon" id="descIcon"></span><input id="desc" data-i18n-ph="whatForPh" placeholder="Dinner, taxi, groceries…" maxlength="60" autocomplete="off"></label>
    <div class="field-row static"><span class="muted" data-i18n="paidBy">Paid by</span><span class="right" data-i18n="you">You</span></div>
    <div class="split-head"><span data-i18n="splitEqually">Split equally</span><span><button type="button" class="link" id="selAll" data-i18n="all">All</button> · <button type="button" class="link" id="selNone" data-i18n="none">None</button></span></div>
    <div class="split-opts" id="splitOpts"></div>
    <p class="preview num" id="preview"></p>
    <p class="err" id="expErr"></p>
    <button class="btn primary wide save-btn" type="submit" data-i18n="addExpense">Add expense</button>
  </form>
</div>



<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
